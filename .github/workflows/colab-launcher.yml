name: AVRORA public Colab launcher (safe smoke only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "local (no auth) or colab (authorized CPU only)"
        required: true
        type: choice
        default: local
        options:
          - local
          - colab
  # Hourly schedule; only performs remote Colab work AFTER enabling the repository variable.
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/colab-launcher.yml'
      - '.github/workflows/avrora-private-wave.yml'
      - 'tests/test_gas_shadow_fallback_route.py'
      - 'tools/forward_m15_transport.py'
      - 'tests/test_forward_m15_transport.py'

permissions:
  contents: read

concurrency:
  group: avrora-colab-public-launcher
  cancel-in-progress: false

jobs:
  # Scientific discovery: 64 unique LONG/SHORT variants/hour on already studied P816;
  # invokes PRIVATE code via read-only key, NEVER trades, and NO additional cron.
  multifamily-shadow-scheduled:
    if: ${{ github.event_name == 'schedule' }}
    uses: ./.github/workflows/multifamily-sweep-smoke.yml
    secrets: inherit

  # This is the only scheduled entry point; one FULL13 candidate per hour.
  full13-scheduled:
    if: ${{ github.event_name == 'schedule' }}
    uses: ./.github/workflows/avrora-private-wave.yml
    secrets: inherit

  safety-smoke:
    # Pushes to the fallback routing contract run OFFLINE checks only.
    # RUN_REMOTE remains false for push: no Colab/credentials/new trading.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REAL: "OFF"
      HOLDOUT: "SEALED"
      RUN_REMOTE: ${{ github.event_name == 'schedule' || inputs.mode == 'colab' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline safety gate
        run: |
          set -euo pipefail
          bash -n tools/connect_cloud_shell.sh
          python -m unittest discover -s tests -v
          python smoke.py | tee local-smoke.log
          python tools/verify_receipt.py local-smoke.log local_receipt.json
      - name: Validate Google user credentials from repository secret
        if: ${{ env.RUN_REMOTE == 'true' }}
        env:
          AVRORA_COLAB_ADC_JSON_B64: ${{ secrets.AVRORA_COLAB_ADC_JSON_B64 }}
        run: |
          set -euo pipefail
          python tools/write_adc.py
      - name: Execute Colab CPU smoke and terminate automatically
        if: ${{ env.RUN_REMOTE == 'true' }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'google-colab-cli==0.7.4'
          colab version
          # Public repository: never stream remote Colab output into public logs.
          if ! colab --auth=adc run smoke.py > remote-smoke.log 2>&1; then
            echo 'REMOTE_COLAB_EXECUTION_FAILED (details withheld to protect credentials)'
            exit 1
          fi
          python tools/verify_receipt.py remote-smoke.log remote_receipt.json
          echo "AVRORA_REMOTE_COLAB_PASS"
      - name: Upload sanitized proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: avrora-smoke-receipts-${{ github.run_id }}
          path: |
            local_receipt.json
            remote_receipt.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Delete temporary Google credentials
        if: ${{ always() }}
        run: |
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          fi

  capture-forward-m15:
    name: Public Bybit M15 transport (no trading/strategy)
    # OFF by default: US GitHub runners receive Bybit HTTP 403 (provider geo restriction).
    # Only enable on a compliant, provider-supported runner after documented access check.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && vars.AVRORA_FORWARD_CAPTURE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REAL: "OFF"
      HOLDOUT: "SEALED"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify transport-only unit tests without internet
        run: python -m unittest discover -s tests -p 'test_forward_m15_transport.py' -v
      - name: Collect six public Bybit closed-candle responses with receipt timestamps and SHA-256
        run: |
          set -euo pipefail
          python -m tools.forward_m15_transport --output forward_m15_capture
      - name: Preserve public market-data provenance for private Drive ingestion
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: avrora-public-forward-m15-${{ github.run_id }}
          path: forward_m15_capture/
          if-no-files-found: error
          retention-days: 2

  capture-official-sol-archive:
    name: Official Bybit SOL daily history (public transport only)
    # Reuses the EXISTING 7 * * * * schedule; no extra cron.
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REAL: "OFF"
      HOLDOUT: "SEALED"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identify previous completed UTC calendar day
        id: day
        run: |
          echo "day=$(date -u -d yesterday +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Check daily archive duplicate marker
        id: cached
        uses: actions/cache/restore@v4
        with:
          path: .avrora_archive_captured
          key: bybit-official-sol-archive-v1-${{ steps.day.outputs.day }}
      - name: Verify official archive-only transport code
        if: ${{ steps.cached.outputs.cache-hit != 'true' }}
        run: python -m unittest discover -s tests -p 'test_bybit_official_archive_transport.py' -v
      - name: Capture timestamped source archive, or say WAIT
        id: archive
        if: ${{ steps.cached.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set +e
          python -m tools.bybit_official_archive_transport \
            --day "${{ steps.day.outputs.day }}" --output-dir official_source
          status=$?
          set -e
          if [[ "$status" -eq 3 ]]; then
            echo "captured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "BLOCKED_OFFICIAL_ARCHIVE_TRANSPORT"
            exit "$status"
          fi
          echo "captured=true" >> "$GITHUB_OUTPUT"
      - name: Archive immutable public source + SHA receipt for PRIVATE ingestion
        if: ${{ steps.archive.outputs.captured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: avrora-official-sol-history-${{ steps.day.outputs.day }}-${{ github.run_id }}
          path: official_source/
          if-no-files-found: error
          retention-days: 7
      - name: Mark source date after successful artifact upload
        if: ${{ steps.archive.outputs.captured == 'true' }}
        shell: bash
        run: |
          mkdir -p .avrora_archive_captured
          printf '%s\n' "${{ github.run_id }}" > .avrora_archive_captured/${{ steps.day.outputs.day }}.txt
      - name: Cache marker (re-check delivery in Google Drive independently)
        if: ${{ steps.archive.outputs.captured == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .avrora_archive_captured
          key: bybit-official-sol-archive-v1-${{ steps.day.outputs.day }}
