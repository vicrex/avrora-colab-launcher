name: PsyAI Gemma 4 12B T4 GPU 8GiB one-shot preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/psyai-gpu8-colab-one-shot.yml'
      - 'tools/psyai_case34_gpu8_colab_probe.py'
      - 'tools/psyai_gpu8_colab_bridge.py'
      - 'tools/psyai_gpu8_status.py'

permissions:
  contents: read
  statuses: write

concurrency:
  group: psyai-colab-cpu-global-nonparallel
  cancel-in-progress: true

jobs:
  psyai-gpu8-colab:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout launcher, no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate GPU8 isolated runner (no model yet)
        run: |
          python -m py_compile tools/psyai_case34_gpu8_colab_probe.py tools/psyai_gpu8_colab_bridge.py tools/psyai_gpu8_status.py
          python - <<'PY'
          import importlib.util
          p="tools/psyai_case34_gpu8_colab_probe.py"
          spec=importlib.util.spec_from_file_location("gpu8",p)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.CAP_MIB==8192
          assert module.MODEL_SHA=="93567e57a8fe10b23569b9d9ec38cd005deedf71e29477c421a4b83f418a538b"
          assert module.MARKER=="PSYAI_GPU8_COLAB_RECEIPT="
          assert module.CUDA_TAG=="b11774"
          assets={name:digest for name,digest,_ in module.CUDA_ASSETS}
          assert assets["llama-b11774-bin-ubuntu-cuda-12.8-x64.tar.gz"]=="7d03c8482b62c9533d47e777c0d3ca2edce6e57916b51f587a4576d332757fbb"
          assert assets["cudart-llama-b11774-bin-ubuntu-cuda-12.8-x64.tar.gz"]=="d4fe9a68a521add2001396fdc324dcc613104a2e7a175b68823448793bf8eb9f"
          from pathlib import Path
          assert module.recognize_generated_canary("Маяк.".encode("utf-8"))[0]
          assert module.recognize_generated_canary(b"The answer is lighthouse.")[0]
          assert not module.recognize_generated_canary(b"")[0]
          assert not module.recognize_generated_canary(b"llama_perf_context_print: eval time = 99 ms / 1 runs")[0]
          assert not module.recognize_generated_canary("Как называется башня с огнём?".encode("utf-8"))[0]
          argv=module.canary_command(Path("/tmp/llama-completion"),Path("/tmp/pinned.gguf"))
          assert argv[0]=="/tmp/llama-completion"
          assert all(flag in argv for flag in ("--jinja","--single-turn","--simple-io","--no-display-prompt"))
          assert "--no-conversation" not in argv
          print("PASS_GPU8_RUNNER_STATIC_GUARD")
          PY
      - name: Require existing AVRORA Google Colab ADC; do not reauthorize
        env:
          ADC_PRESENT: ${{ secrets.AVRORA_COLAB_ADC_JSON_B64 != '' }}
        run: |
          if [ "$ADC_PRESENT" != "true" ]; then
            echo "BLOCKED_EXISTING_GOOGLE_COLAB_ADC_NOT_CONFIGURED"
            exit 2
          fi
      - name: Recover existing credentials to temporary runner file
        env:
          AVRORA_COLAB_ADC_JSON_B64: ${{ secrets.AVRORA_COLAB_ADC_JSON_B64 }}
        run: python tools/write_adc.py
      - name: Reuse exactly the existing AVRORA CLI (no browser)
        run: python -m pip install -q --disable-pip-version-check 'google-colab-cli==0.7.4'
      - name: Verify installed Colab CLI v0.7.4 exposes GPU and timeout options
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata,inspect,sys
          try:
              version=importlib.metadata.version("google-colab-cli")
              from colab_cli.commands.run import run_command
              options=inspect.signature(run_command).parameters
          except (ImportError,ValueError) as exc:
              print("COLAB_CLI_IMPORT_OR_METADATA_ERROR:"+type(exc).__name__)
              sys.exit(2)
          if version!="0.7.4" or "gpu" not in options or "timeout" not in options:
              print("COLAB_CLI_GPU_TIMEOUT_OPTIONS_UNAVAILABLE")
              sys.exit(2)
          if options["timeout"].default!=30.0:
              print("COLAB_CLI_DEFAULT_TIMEOUT_CHANGED")
              sys.exit(2)
          print("PASS_COLAB_CLI_0_7_4_GPU_TIMEOUT_VERIFIED")
          PY
      - name: Run bounded Colab CLI with independent commit-status heartbeat
        shell: bash
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u tools/psyai_gpu8_colab_bridge.py
      - name: Persist only sanitized GPU evidence, never remote logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: psyai-gpu8-colab-${{ github.run_id }}
          path: psyai_gpu8_proof.json
          if-no-files-found: warn
          retention-days: 7
      - name: Erase auth and logs
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          fi
          rm -f psyai_gpu8_remote.log
