name: PsyAI Gemma 4 12B T4 GPU 8GiB one-shot preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/psyai-gpu8-colab-one-shot.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: psyai-colab-cpu-global-nonparallel
  cancel-in-progress: true

jobs:
  psyai-gpu8-colab:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout launcher, no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate GPU8 isolated runner (no model yet)
        run: |
          python -m py_compile tools/psyai_case34_gpu8_colab_probe.py tools/psyai_gpu8_colab_bridge.py tools/psyai_gpu8_status.py
          python - <<'PY'
          import importlib.util
          p="tools/psyai_case34_gpu8_colab_probe.py"
          spec=importlib.util.spec_from_file_location("gpu8",p)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.CAP_MIB==8192
          assert module.MODEL_SHA=="93567e57a8fe10b23569b9d9ec38cd005deedf71e29477c421a4b83f418a538b"
          assert module.MARKER=="PSYAI_GPU8_COLAB_RECEIPT="
          print("PASS_GPU8_RUNNER_STATIC_GUARD")
          PY
      - name: Require existing AVRORA Google Colab ADC; do not reauthorize
        env:
          ADC_PRESENT: ${{ secrets.AVRORA_COLAB_ADC_JSON_B64 != '' }}
        run: |
          if [ "$ADC_PRESENT" != "true" ]; then
            echo "BLOCKED_EXISTING_GOOGLE_COLAB_ADC_NOT_CONFIGURED"
            exit 2
          fi
      - name: Recover existing credentials to temporary runner file
        env:
          AVRORA_COLAB_ADC_JSON_B64: ${{ secrets.AVRORA_COLAB_ADC_JSON_B64 }}
        run: python tools/write_adc.py
      - name: Reuse exactly the existing AVRORA CLI (no browser)
        run: python -m pip install -q --disable-pip-version-check 'google-colab-cli==0.7.4'
      - name: Preflight Colab CLI GPU run syntax without allocating any runtime
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,sys
          try:
              p=subprocess.run(["colab","--auth=adc","run","--help"],
                               stdin=subprocess.DEVNULL,capture_output=True,
                               text=True,timeout=40,check=False)
          except (OSError,subprocess.TimeoutExpired):
              print("COLAB_CLI_HELP_FAILED")
              sys.exit(2)
          if p.returncode or "--gpu" not in p.stdout or "--gpu" not in (p.stdout+p.stderr):
              print("COLAB_CLI_GPU_FLAG_UNAVAILABLE")
              sys.exit(2)
          print("COLAB_CLI_GPU_FLAG_VERIFIED")
          PY
      - name: Run bounded Colab CLI with independent commit-status heartbeat
        shell: bash
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u tools/psyai_gpu8_colab_bridge.py
      - name: Persist only sanitized GPU evidence, never remote logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: psyai-gpu8-colab-${{ github.run_id }}
          path: psyai_gpu8_proof.json
          if-no-files-found: warn
          retention-days: 7
      - name: Erase auth and logs
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          fi
          rm -f psyai_gpu8_remote.log
